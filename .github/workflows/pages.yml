name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # نسخة المزامنة المشفّرة تُرفع كثيراً ولا تغيّر الموقع: لا داعي لإعادة النشر في كل مرة
    paths-ignore: ['alaisai-backup.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: اختبارات الوحدة والكتالوج
        run: |
          node tools/build-catalog.mjs
          node tests/run.mjs
      - name: ختم رقم البناء في Service Worker (ليصل التحديث لكل المستخدمين)
        run: sed -i "s/const BUILD = 'dev'/const BUILD = '${GITHUB_SHA::7}'/" sw.js
      - name: تجهيز الموقع
        run: |
          mkdir _site
          cp -r index.html 404.html privacy.html terms.html manifest.json sw.js favicon.ico robots.txt sitemap.xml .nojekyll assets src catalog .well-known _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
