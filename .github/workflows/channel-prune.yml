name: channel-prune
# تنظيف أسبوعي لقناة المالك (control/channel.json): أرشفة القديم وحذف المنتهي من الموقع فقط.
# لا يمسّ ما نُزّل على أجهزة المستخدمين.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prune
        run: node tools/prune-channel.mjs control/channel.json
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "channel-bot"
            git config user.email "channel-bot@users.noreply.github.com"
            git add control/channel.json
            git commit -m "channel: scheduled prune"
            git push
          fi
