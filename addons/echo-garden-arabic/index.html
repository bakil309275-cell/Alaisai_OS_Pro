<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صدى الحديقة</title><link rel="stylesheet" href="style.css"><main><h1>✿ صدى الحديقة</h1><p>اجمع الزهور ثم ادخل العلم. عند البذرة ينشأ صدى يكرر خطواتك المسجلة. عندما يصل الصدى إلى البذرة ويبقى عليها، يفتح الباب.</p><label>الحديقة <select id="levels"></select></label><h2 id="title"></h2><div id="board"></div><p id="status" role="status" aria-live="polite"></p><div class="pad"><button data-a="U" class="up">↑<small>أعلى</small></button><button data-a="L" class="left">←<small>يسار</small></button><button data-a="W" class="wait">⏳<small>انتظار</small></button><button data-a="R" class="right">→<small>يمين</small></button><button data-a="D" class="down">↓<small>أسفل</small></button></div><div class="actions"><button id="reset">إعادة الحديقة</button><button id="next" hidden>الحديقة التالية</button></div><p>🌱 بذرة صدى · ◉ علامة أرضية · ▥ باب · 🌸 زهرة · 🏁 مخرج</p><p>أول حديقة: أسفل مرتين، يمين مرتين، أسفل مرتين.</p></main><script src="main.js"></script></html>
