<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131a"><title>ساحة البلياردو العربية</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div><h1>🎱 ساحة البلياردو</h1><p>تحدّي الكرات · نسخة قابلة للعب</p></div><span class="wallet">◈ <b id="coins">0</b></span></header>
<section class="hero"><div><small>دقة، تخطيط، ومنافسة</small><h2>الطاولة جاهزة للتحدّي</h2><p>قواعد مبسطة: أكمل مجموعتك ثم أدخل الكرة 8.</p></div><button id="daily">🎁 هدية اليوم</button></section>
<section class="modes" aria-label="وضع اللعب"><button data-mode="ai" aria-pressed="true">🤖 الكمبيوتر</button><button data-mode="local" aria-pressed="false">👥 لاعبان محليان</button><button id="invite">🔗 دعوة صديق</button></section>
<section class="toolbar"><label>الصعوبة <select id="difficulty"><option value="easy">سهلة</option><option value="normal" selected>متوسطة</option><option value="hard">صعبة</option></select></label><button id="rules">القواعد</button><button id="settings">⚙ الإعدادات</button></section>
<section class="board"><div class="score"><span id="player0"></span><strong id="turn" role="status" aria-live="polite"></strong><span id="player1"></span></div><canvas id="table" width="1000" height="540" tabindex="0" aria-label="طاولة البلياردو. استخدم السحب أو أزرار الاتجاه للتصويب، والمسافة للتسديد."></canvas><p id="hint">اسحب من الكرة البيضاء بعكس اتجاه التسديدة، ثم ارفع إصبعك. أو اضبط الاتجاه والقوة أدناه.</p><div class="controls"><label>الاتجاه <input id="angle" type="range" min="-180" max="180" value="0"><output id="angleValue">0°</output></label><label>القوة <input id="power" type="range" min="10" max="100" value="55"><output id="powerValue">55%</output></label></div><div class="actions"><button id="shoot" class="primary">🎱 تسديد</button><button id="boost">⚡ تعزيز · 20 ◈</button><button id="restart">↻ مباراة جديدة</button></div><p id="notice" role="status" aria-live="polite"></p></section>
<section class="stats"><h2>سجلّك</h2><div id="stats"></div><p>الجوائز افتراضية داخل اللعبة، وليست أموالاً حقيقية.</p></section>
<dialog id="modal"><div id="modalBody"></div><form method="dialog"><button autofocus>إغلاق</button></form></dialog><div id="toast" role="status" aria-live="polite"></div>
</main><script src="main.js"></script></body></html>
