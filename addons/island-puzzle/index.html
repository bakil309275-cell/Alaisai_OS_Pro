<main id="game" aria-live="polite">
  <header class="top">
    <h1>🏝️ لغز الجزيرة</h1>
    <div class="meta"><span id="lvl-badge"></span><span id="hint-count"></span></div>
    <div class="bar" role="progressbar" aria-label="التقدّم" aria-valuemin="0" aria-valuemax="6" id="bar"><i id="bar-fill"></i></div>
  </header>

  <section id="scene" class="card"></section>

  <aside class="card" id="inventory-wrap">
    <h2>🎒 ما جمعته</h2>
    <ul id="inventory"><li class="empty">لا شيء بعد</li></ul>
  </aside>

  <footer class="foot"><button id="restart" class="ghost" type="button">↺ ابدأ من جديد</button></footer>
</main>
