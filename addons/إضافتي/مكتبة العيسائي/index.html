<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>مكتبة العيسائي القانونية الرقمية</title>
<meta name="description" content="مكتبة قانونية رقمية: نماذج وصيغ وقوانين ومذكرات، تعمل دون إنترنت وقابلة للتثبيت." />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192x192.png" />
<link rel="apple-touch-icon" href="icons/icon-192x192.png" />
<meta name="theme-color" content="#1f1a14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="css/style.css">
<link rel="modulepreload" href="js/app.js">
<link rel="modulepreload" href="js/ui.js">
<link rel="modulepreload" href="js/lib.js">
<link rel="modulepreload" href="js/db.js">
<link rel="modulepreload" href="js/crypto.js">
<link rel="modulepreload" href="js/sanitize.js">
<link rel="modulepreload" href="js/github.js">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">📚</div>
      <div>
        <h1 class="title">مكتبة العيسائي القانونية الرقمية</h1>
        <div class="small">تعمل بدون إنترنت • قابلة للتثبيت <span id="net"></span></div>
      </div>
    </div>
    <div class="actions">
      <button id="btn-install" class="icon-btn install-btn">⬇️ تثبيت</button>
      <button id="btn-admin" class="icon-btn">🔒 الإدارة</button>
    </div>
  </header>

  <div id="admin-bar" class="admin-bar" aria-label="أدوات الإدارة"></div>

  <nav class="icon-strip" aria-label="الأنواع"><div class="strip-inner" id="top-icons"></div></nav>

  <div class="search-row">
    <input id="search" class="search-input" type="search" placeholder="ابحث بالعربية أو English في كل المكتبة..." aria-label="بحث" />
  </div>

  <main class="layout">
    <aside class="left-panel index-panel">
      <div class="panel-title" id="index-title">الفهرس</div>
      <div id="public-index-root" class="index-window"></div>
    </aside>

    <section class="right-panel">
      <div class="viewer-head" id="viewer-head">
        <div>
          <div id="item-title" class="viewer-title">اختر عنصرًا للعرض</div>
          <div id="item-meta" class="small"></div>
        </div>
        <div class="row wrap hidden" id="viewer-actions">
          <button id="btn-edit-selected" class="icon-btn admin-only">✏️ تعديل</button>
          <button id="btn-font-down" class="icon-btn" aria-label="تصغير الخط" title="تصغير الخط">أ−</button>
          <button id="btn-font-up" class="icon-btn" aria-label="تكبير الخط" title="تكبير الخط">أ+</button>
          <button id="btn-download-selected" class="icon-btn">⬇️ تنزيل</button>
          <button id="btn-print-selected" class="icon-btn">🖨️ طباعة</button>
          <button id="btn-copy-selected" class="icon-btn">📋 نسخ</button>
          <button id="btn-share-selected" class="icon-btn">📤 مشاركة</button>
        </div>
      </div>
      <div id="viewer-content" class="viewer"></div>
    </section>

    <aside class="left-panel contact-panel">
      <div class="contact">
        <div class="panel-title">مراسلة الإدارة</div>
        <input id="visitor-name" class="input" placeholder="الاسم (اختياري)" aria-label="الاسم" />
        <textarea id="visitor-message" class="input" placeholder="رسالتك..." rows="4" aria-label="الرسالة"></textarea>
        <input id="visitor-files" class="input" type="file" multiple aria-label="مرفقات" />
        <div class="row" style="margin-top:8px">
          <button id="send-wa" class="btn primary">واتساب</button>
          <button id="send-mail" class="btn neutral">بريد</button>
          <button id="btn-view-uploads" class="btn neutral">رسائلي</button>
        </div>
        <div id="contact-hint" class="small" style="margin-top:8px"></div>
      </div>
    </aside>
  </main>

  <footer class="footer">© <span id="year"></span> مكتبة العيسائي القانونية الرقمية • <a href="privacy.html">سياسة الخصوصية</a> • v<span id="ver"></span></footer>
</div>
<script src="js/sw-register.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
