<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المتصفح السريع - بوابة المطورين</title>
<style>
  :root {
    --bg-grad-start: #1a1a2e;
    --bg-grad-end: #16213e;
    --gold: #4cc9f0;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  
  body { 
    background-color: #0f0f1a; 
    color: var(--text-main); 
    display: flex; justify-content: center; min-height: 100vh; padding: 10px;
  }

  #app-container {
    width: 100%; max-width: 650px; 
    background: linear-gradient(145deg, var(--bg-grad-start), var(--bg-grad-end)); 
    border-radius: 25px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative; height: fit-content; min-height: 90vh;
  }

  /* === رأس التطبيق === */
  .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .header-icon {
    width: 45px; height: 45px; border-radius: 15px;
    background: linear-gradient(135deg, var(--gold), #f72585);
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { width: 26px; height: 26px; fill: white; }
  .header-text h1 { font-size: 1.2rem; margin: 0; color: white; }
  .header-text p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.75rem; }
  
  /* زر إعدادات الأقسام */
  .btn-settings {
    margin-right: auto;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--gold);
    color: var(--gold);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem; transition: 0.2s;
  }
  .btn-settings:hover { background: var(--gold); color: #000; transform: rotate(45deg); }

  /* === شريط البحث === */
  .search-box {
    width: 100%; padding: 12px 15px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: white; font-size: 0.95rem;
    margin-bottom: 20px; outline: none; transition: 0.3s;
  }
  .search-box:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(76, 201, 240, 0.2); }

  /* === العناوين والأقسام === */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin: 15px 0 8px 0; padding-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .section-title {
    font-size: 0.95rem; color: var(--gold);
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .section-title::before {
    content: ''; display: block; width: 4px; height: 14px; background: var(--gold); border-radius: 2px;
  }
  .menu-btn {
    background: transparent; border: none; color: var(--text-muted);
    font-size: 1.4rem; cursor: pointer; padding: 0 5px; transition: 0.2s; line-height: 1;
  }
  .menu-btn:hover { color: white; transform: scale(1.1); }

  /* === شبكة التطبيقات === */
  .site-grid { 
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; 
  }

  /* === بطاقة التطبيق === */
  .site-btn { 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 4px; border-radius: 10px;
    text-decoration: none; text-align: center;
    transition: transform 0.2s, filter 0.2s; 
    border: 1px solid rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .site-btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  
  .site-btn svg, .site-btn img { width: 24px; height: 24px; object-fit: contain; fill: currentColor; flex-shrink: 0; border-radius: 4px; }
  
  .site-names { display: flex; flex-direction: column; line-height: 1.2; width: 100%; }
  .site-name-en { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-name-ar { font-size: 0.65rem; opacity: 0.9; font-weight: 500; }

  /* === التنبيه المحلي === */
  .warning-box {
    background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.3);
    color: #fde047; padding: 8px 12px; border-radius: 8px;
    font-size: 0.7rem; margin-top: 10px; text-align: center; line-height: 1.4;
  }

  /* === الشريط السفلي === */
  .footer-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 12px;
    font-size: 0.75rem; margin-top: 20px; color: var(--text-muted);
  }
  .footer-bar strong { color: var(--gold); }

  /* === النوافذ المنبثقة (Modal) === */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  
  .modal-content {
    background: #1e1e2f; border: 1px solid var(--gold); border-radius: 15px;
    width: 90%; max-width: 400px; padding: 20px; max-height: 85vh;
    display: flex; flex-direction: column;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  .modal-title { font-size: 1.1rem; color: var(--gold); font-weight: bold; }
  .modal-close { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
  
  /* إدارة القوائم */
  .manage-list { overflow-y: auto; margin-bottom: 15px; padding-left: 5px; flex: 1; }
  .manage-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px;
    margin-bottom: 8px;
  }
  .manage-item-info { display: flex; flex-direction: column; }
  .manage-item-name { font-size: 0.85rem; font-weight: bold; }
  .manage-item-name span { font-size: 0.7rem; color: var(--text-muted); font-weight: normal; }
  .manage-actions { display: flex; gap: 4px; }
  
  .btn-icon { background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .btn-icon:hover { background: var(--gold); color: #000; }
  .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-icon.edit:hover { background: #4cc9f0; color: #000; }
  .btn-icon.danger { color: #ff6b6b; }
  .btn-icon.danger:hover { background: #ff6b6b; color: #fff; }

  /* أزرار النافذة */
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn-primary {
    background: var(--gold); color: #000; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-success {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 5px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
  }
  .btn-success:hover { filter: brightness(1.1); }

  /* حقول الإدخال */
  .input-group { margin-bottom: 10px; }
  .input-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
  .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; outline: none; }
  .input-group input:focus { border-color: var(--gold); }
  .input-group input[type="file"] { font-size: 0.8rem; padding: 5px; }
  .opt-text { font-size: 0.7rem; color: #64748b; margin-right: 5px; }

  @media (max-width: 400px) {
    .site-name-en { font-size: 0.7rem; }
    .site-name-ar { font-size: 0.6rem; }
    .site-btn svg, .site-btn img { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<div id="app-container">
  
  <div class="app-header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    </div>
    <div class="header-text">
      <h1>المتصفح السريع</h1>
      <p>بوابة أدوات المطورين والمصممين</p>
    </div>
    <button class="btn-settings" onclick="openCategoryManageModal()" title="إدارة الأقسام">
      ⚙️
    </button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن أداة أو موقع...">

  <div id="sitesContainer"></div>

  <div class="footer-bar">
    <span>⚡ سرعة فائقة</span>
    <span>● <strong id="siteCount">0</strong> موقعاً</span>
    <span>📁 <strong id="catCount">0</strong> أقسام</span>
  </div>

</div>

<!-- ========================================== -->
<!-- نافذة إدارة الأقسام (جديدة) -->
<!-- ========================================== -->
<div class="modal-overlay" id="categoryManageModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">إدارة الأقسام</div>
      <button class="modal-close" onclick="closeModal('categoryManageModal')">✖</button>
    </div>
    
    <div class="manage-list" id="categoryManageList"></div>
    
    <div class="modal-actions">
      <button class="btn-primary" onclick="addNewCategory()">➕ إضافة قسم جديد</button>
    </div>
  </div>
</div>

<!-- نافذة إدارة الاختصارات داخل القسم -->
<div class="modal-overlay" id="manageModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="manageModalTitle">إدارة القسم</div>
      <button class="modal-close" onclick="closeModal('manageModal')">✖</button>
    </div>
    
    <div class="manage-list" id="manageList"></div>
    
    <div class="modal-actions">
      <button class="btn-primary" onclick="openAddModal()">➕ إضافة اختصار جديد</button>
      <button class="btn-success" onclick="exportCode()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        حفظ / مشاركة الكود
      </button>
    </div>
  </div>
</div>

<!-- نافذة إضافة / تعديل اختصار -->
<div class="modal-overlay" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="addModalTitle">إضافة اختصار</div>
      <button class="modal-close" onclick="closeModal('addModal')">✖</button>
    </div>
    <div class="input-group">
      <label>الرابط (إجباري)</label>
      <input type="url" id="newUrl" placeholder="https://example.com" dir="ltr">
    </div>
    <div class="input-group">
      <label>الاسم بالإنجليزية <span class="opt-text">(اختياري)</span></label>
      <input type="text" id="newNameEn" placeholder="مثال: YouTube" dir="ltr">
    </div>
    <div class="input-group">
      <label>الاسم بالعربية <span class="opt-text">(اختياري)</span></label>
      <input type="text" id="newNameAr" placeholder="مثال: يوتيوب">
    </div>
    <div class="input-group">
      <label>لون الخلفية <span class="opt-text">(اختياري)</span></label>
      <input type="color" id="newColor" value="#4cc9f0" style="height: 40px; padding: 2px;">
    </div>
    <div class="input-group">
      <label>رفع أيقونة مخصصة <span class="opt-text">(اختياري - يجلب الشعار تلقائياً إذا تُرك فارغاً)</span></label>
      <input type="file" id="newIconFile" accept="image/*">
    </div>
    <button class="btn-primary" id="btnSaveShortcut" style="margin-top: 10px;">حفظ الاختصار</button>
  </div>
</div>


</body>
</html>
