<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المتصفح السريع - بوابة المطورين</title>
<style>
  :root {
    --bg-grad-start: #1a1a2e;
    --bg-grad-end: #16213e;
    --gold: #4cc9f0;
    --text-main: #ffffff;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  
  body { 
    background-color: #0f0f1a; 
    color: var(--text-main); 
    display: flex; justify-content: center; min-height: 100vh; padding: 10px;
  }

  #app-container {
    width: 100%; max-width: 650px; 
    background: linear-gradient(145deg, var(--bg-grad-start), var(--bg-grad-end)); 
    border-radius: 25px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative; height: fit-content; min-height: 90vh;
  }

  /* === رأس التطبيق === */
  .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .header-icon {
    width: 45px; height: 45px; border-radius: 15px;
    background: linear-gradient(135deg, var(--gold), #f72585);
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { width: 26px; height: 26px; fill: white; }
  .header-text h1 { font-size: 1.2rem; margin: 0; color: white; }
  .header-text p { margin: 2px 0 0; color: var(--text-muted); font-size: 0.75rem; }
  
  /* زر إعدادات الأقسام */
  .btn-settings {
    margin-right: auto;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--gold);
    color: var(--gold);
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem; transition: 0.2s;
  }
  .btn-settings:hover { background: var(--gold); color: #000; transform: rotate(45deg); }

  /* === شريط البحث === */
  .search-box {
    width: 100%; padding: 12px 15px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: white; font-size: 0.95rem;
    margin-bottom: 20px; outline: none; transition: 0.3s;
  }
  .search-box:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(76, 201, 240, 0.2); }

  /* === العناوين والأقسام === */
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin: 15px 0 8px 0; padding-bottom: 5px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .section-title {
    font-size: 0.95rem; color: var(--gold);
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .section-title::before {
    content: ''; display: block; width: 4px; height: 14px; background: var(--gold); border-radius: 2px;
  }
  .menu-btn {
    background: transparent; border: none; color: var(--text-muted);
    font-size: 1.4rem; cursor: pointer; padding: 0 5px; transition: 0.2s; line-height: 1;
  }
  .menu-btn:hover { color: white; transform: scale(1.1); }

  /* === شبكة التطبيقات === */
  .site-grid { 
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; 
  }

  /* === بطاقة التطبيق === */
  .site-btn { 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 10px 4px; border-radius: 10px;
    text-decoration: none; text-align: center;
    transition: transform 0.2s, filter 0.2s; 
    border: 1px solid rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .site-btn:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  
  .site-btn svg, .site-btn img { width: 24px; height: 24px; object-fit: contain; fill: currentColor; flex-shrink: 0; border-radius: 4px; }
  
  .site-names { display: flex; flex-direction: column; line-height: 1.2; width: 100%; }
  .site-name-en { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-name-ar { font-size: 0.65rem; opacity: 0.9; font-weight: 500; }

  /* === التنبيه المحلي === */
  .warning-box {
    background: rgba(234, 179, 8, 0.1); border: 1px solid rgba(234, 179, 8, 0.3);
    color: #fde047; padding: 8px 12px; border-radius: 8px;
    font-size: 0.7rem; margin-top: 10px; text-align: center; line-height: 1.4;
  }

  /* === الشريط السفلي === */
  .footer-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 12px;
    font-size: 0.75rem; margin-top: 20px; color: var(--text-muted);
  }
  .footer-bar strong { color: var(--gold); }

  /* === النوافذ المنبثقة (Modal) === */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; justify-content: center; align-items: center;
    z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  
  .modal-content {
    background: #1e1e2f; border: 1px solid var(--gold); border-radius: 15px;
    width: 90%; max-width: 400px; padding: 20px; max-height: 85vh;
    display: flex; flex-direction: column;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  .modal-title { font-size: 1.1rem; color: var(--gold); font-weight: bold; }
  .modal-close { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
  
  /* إدارة القوائم */
  .manage-list { overflow-y: auto; margin-bottom: 15px; padding-left: 5px; flex: 1; }
  .manage-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); padding: 8px 10px; border-radius: 8px;
    margin-bottom: 8px;
  }
  .manage-item-info { display: flex; flex-direction: column; }
  .manage-item-name { font-size: 0.85rem; font-weight: bold; }
  .manage-item-name span { font-size: 0.7rem; color: var(--text-muted); font-weight: normal; }
  .manage-actions { display: flex; gap: 4px; }
  
  .btn-icon { background: rgba(255,255,255,0.1); border: none; color: white; padding: 4px 6px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
  .btn-icon:hover { background: var(--gold); color: #000; }
  .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-icon.edit:hover { background: #4cc9f0; color: #000; }
  .btn-icon.danger { color: #ff6b6b; }
  .btn-icon.danger:hover { background: #ff6b6b; color: #fff; }

  /* أزرار النافذة */
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  .btn-primary {
    background: var(--gold); color: #000; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
  }
  .btn-success {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; border: none; padding: 10px;
    border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 5px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
  }
  .btn-success:hover { filter: brightness(1.1); }

  /* حقول الإدخال */
  .input-group { margin-bottom: 10px; }
  .input-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-muted); }
  .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; outline: none; }
  .input-group input:focus { border-color: var(--gold); }
  .input-group input[type="file"] { font-size: 0.8rem; padding: 5px; }
  .opt-text { font-size: 0.7rem; color: #64748b; margin-right: 5px; }

  @media (max-width: 400px) {
    .site-name-en { font-size: 0.7rem; }
    .site-name-ar { font-size: 0.6rem; }
    .site-btn svg, .site-btn img { width: 20px; height: 20px; }
  }
</style>
</head>
<body>

<div id="app-container">
  
  <div class="app-header">
    <div class="header-icon">

    </div>
    <div class="header-text">
      <h1>المتصفح السريع</h1>
      <p>بوابة أدوات المطورين والمصممين</p>
    </div>
    <button class="btn-settings" onclick="openCategoryManageModal()" title="إدارة الأقسام">
      ⚙️
    </button>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن أداة أو موقع...">

  <div id="sitesContainer"></div>

  <div class="footer-bar">
    <span>⚡ سرعة فائقة</span>
    <span>● <strong id="siteCount">0</strong> موقعاً</span>
    <span>📁 <strong id="catCount">0</strong> أقسام</span>
  </div>

</div>

<!-- ========================================== -->
<!-- نافذة إدارة الأقسام (جديدة) -->
<!-- ========================================== -->
<div class="modal-overlay" id="categoryManageModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">إدارة الأقسام</div>
      <button class="modal-close" onclick="closeModal('categoryManageModal')">✖</button>
    </div>
    
    <div class="manage-list" id="categoryManageList"></div>
    
    <div class="modal-actions">
      <button class="btn-primary" onclick="addNewCategory()">➕ إضافة قسم جديد</button>
    </div>
  </div>
</div>

<!-- نافذة إدارة الاختصارات داخل القسم -->
<div class="modal-overlay" id="manageModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="manageModalTitle">إدارة القسم</div>
      <button class="modal-close" onclick="closeModal('manageModal')">✖</button>
    </div>
    
    <div class="manage-list" id="manageList"></div>
    
    <div class="modal-actions">
      <button class="btn-primary" onclick="openAddModal()">➕ إضافة اختصار جديد</button>
      <button class="btn-success" onclick="exportCode()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        حفظ / مشاركة الكود
      </button>
    </div>
  </div>
</div>

<!-- نافذة إضافة / تعديل اختصار -->
<div class="modal-overlay" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="addModalTitle">إضافة اختصار</div>
      <button class="modal-close" onclick="closeModal('addModal')">✖</button>
    </div>
    <div class="input-group">
      <label>الرابط (إجباري)</label>
      <input type="url" id="newUrl" placeholder="https://example.com" dir="ltr">
    </div>
    <div class="input-group">
      <label>الاسم بالإنجليزية <span class="opt-text">(اختياري)</span></label>
      <input type="text" id="newNameEn" placeholder="مثال: YouTube" dir="ltr">
    </div>
    <div class="input-group">
      <label>الاسم بالعربية <span class="opt-text">(اختياري)</span></label>
      <input type="text" id="newNameAr" placeholder="مثال: يوتيوب">
    </div>
    <div class="input-group">
      <label>لون الخلفية <span class="opt-text">(اختياري)</span></label>
      <input type="color" id="newColor" value="#4cc9f0" style="height: 40px; padding: 2px;">
    </div>
    <div class="input-group">
      <label>رفع أيقونة مخصصة <span class="opt-text">(اختياري - يجلب الشعار تلقائياً إذا تُرك فارغاً)</span></label>
      <input type="file" id="newIconFile" accept="image/*">
    </div>
    <button class="btn-primary" id="btnSaveShortcut" style="margin-top: 10px;">حفظ الاختصار</button>
  </div>
</div>

// ==========================================
// 2. إدارة البيانات
// ==========================================
const STORAGE_KEY = 'quickBrowserData_v7';
let appData = [];

try {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    appData = JSON.parse(stored);
  } else {
    appData = JSON.parse(JSON.stringify(defaultData));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }
} catch (e) {
  appData = JSON.parse(JSON.stringify(defaultData));
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch (e) {}
}

// ==========================================
// 3. عناصر DOM والمتغيرات
// ==========================================
const container = document.getElementById('sitesContainer');
const searchInput = document.getElementById('searchInput');
const siteCountEl = document.getElementById('siteCount');
const catCountEl = document.getElementById('catCount');

let currentCategoryId = null;
let editingIndex = null; 
let uploadedIconBase64 = null;

// ==========================================
// 4. بناء الواجهة
// ==========================================
function renderApp() {
  if (!container) return;
  container.innerHTML = '';
  let visibleSites = 0;
  
  const searchTerm = searchInput.value.toLowerCase().trim();

  appData.forEach(cat => {
    const filteredSites = cat.sites.filter(site => {
      const en = site.nameEn || '';
      const ar = site.nameAr || '';
      return en.toLowerCase().includes(searchTerm) || 
             ar.includes(searchTerm) ||
             cat.category.includes(searchTerm);
    });

    // إخفاء القسم إذا كان البحث لا يطابق أي شيء (إلا إذا كان البحث فارغاً)
    if (filteredSites.length === 0 && searchTerm !== '') return;

    // رأس القسم
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <div class="section-title">${cat.category}</div>
      <button class="menu-btn" onclick="openManageModal('${cat.id}')">⋮</button>
    `;
    container.appendChild(header);

    // الشبكة
    const grid = document.createElement('div');
    grid.className = 'site-grid';

    filteredSites.forEach(site => {
      const a = document.createElement('a');
      a.href = site.url || '#';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'site-btn';
      
      const lightColors = ['#ffffff', '#FFFC00', '#FAB915', '#4cc9f0'];
      const textColor = lightColors.includes(site.color) ? '#000000' : '#ffffff';
      
      a.style.backgroundColor = site.color || '#333';
      a.style.color = textColor;
      
      let iconHtml = '';
      if (site.icon && site.icon.startsWith('data:image')) {
        iconHtml = `<img src="${site.icon}" alt="icon">`;
      } else if (site.icon && site.icon.startsWith('<svg')) {
        iconHtml = site.icon;
      } else if (site.url) {
        iconHtml = `<img src="https://www.google.com/s2/favicons?domain=${site.url}&sz=64" alt="icon" onerror="this.style.display='none'">`;
      }
      
      a.innerHTML = `
        ${iconHtml}
        <div class="site-names">
          <span class="site-name-en">${site.nameEn || 'App'}</span>
          <span class="site-name-ar">${site.nameAr || 'تطبيق'}</span>
        </div>
      `;
      grid.appendChild(a);
      visibleSites++;
    });

    container.appendChild(grid);

    if (cat.id === 'local' && filteredSites.length > 0) {
      const warn = document.createElement('div');
      warn.className = 'warning-box';
      warn.innerHTML = '⚠️ تعمل فقط إذا كان الخادم المحلي قيد التشغيل.';
      container.appendChild(warn);
    }
  });

  if (siteCountEl) siteCountEl.textContent = visibleSites;
  if (catCountEl) catCountEl.textContent = appData.length;

  if (visibleSites === 0 && searchTerm !== '') {
    container.innerHTML = '<div style="text-align:center; color:#aaa; padding:20px;">لا توجد نتائج مطابقة</div>';
  }
}

// ==========================================
// 5. إدارة الأقسام (إضافة، ترتيب، حذف)
// ==========================================
function openCategoryManageModal() {
  renderCategoryManageList();
  document.getElementById('categoryManageModal').classList.add('active');
}

function renderCategoryManageList() {
  const list = document.getElementById('categoryManageList');
  list.innerHTML = '';

  appData.forEach((cat, index) => {
    const item = document.createElement('div');
    item.className = 'manage-item';
    item.innerHTML = `
      <div class="manage-item-info">
        <div class="manage-item-name">${cat.category}</div>
      </div>
      <div class="manage-actions">
        <button class="btn-icon" onclick="moveCategory(${index}, -1)" ${index === 0 ? 'disabled' : ''}>⬆️</button>
        <button class="btn-icon" onclick="moveCategory(${index}, 1)" ${index === appData.length - 1 ? 'disabled' : ''}>⬇️</button>
        <button class="btn-icon edit" onclick="editCategoryName(${index})">✏️</button>
        <button class="btn-icon danger" onclick="deleteCategory(${index})">🗑️</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function addNewCategory() {
  const name = prompt('أدخل اسم القسم الجديد (مثال: ألعابي المفضلة):');
  if (name && name.trim() !== '') {
    const newCat = {
      id: 'cat_' + Date.now(),
      category: name.trim(),
      sites: []
    };
    appData.push(newCat);
    saveData();
    renderCategoryManageList();
    renderApp();
  }
}

function moveCategory(index, direction) {
  const newIndex = index + direction;
  if (newIndex >= 0 && newIndex < appData.length) {
    const temp = appData[index];
    appData[index] = appData[newIndex];
    appData[newIndex] = temp;
    saveData();
    renderCategoryManageList();
    renderApp();
  }
}

function editCategoryName(index) {
  const newName = prompt('أدخل الاسم الجديد للقسم:', appData[index].category);
  if (newName && newName.trim() !== '') {
    appData[index].category = newName.trim();
    saveData();
    renderCategoryManageList();
    renderApp();
  }
}

function deleteCategory(index) {
  if (confirm(`هل أنت متأكد من حذف قسم "${appData[index].category}" بالكامل مع كل اختصاراته؟`)) {
    appData.splice(index, 1);
    saveData();
    renderCategoryManageList();
    renderApp();
  }
}

// ==========================================
// 6. إدارة الاختصارات داخل الأقسام
// ==========================================
function openManageModal(catId) {
  currentCategoryId = catId;
  const cat = appData.find(c => c.id === catId);
  if (!cat) return;
  
  document.getElementById('manageModalTitle').textContent = `إدارة: ${cat.category}`;
  renderManageList();
  document.getElementById('manageModal').classList.add('active');
}

function renderManageList() {
  const cat = appData.find(c => c.id === currentCategoryId);
  const list = document.getElementById('manageList');
  if (!list) return;
  list.innerHTML = '';

  cat.sites.forEach((site, index) => {
    const item = document.createElement('div');
    item.className = 'manage-item';
    item.innerHTML = `
      <div class="manage-item-info">
        <div class="manage-item-name">${site.nameEn} <span>(${site.nameAr})</span></div>
      </div>
      <div class="manage-actions">
        <button class="btn-icon" onclick="moveSite(${index}, -1)" ${index === 0 ? 'disabled' : ''}>⬆️</button>
        <button class="btn-icon" onclick="moveSite(${index}, 1)" ${index === cat.sites.length - 1 ? 'disabled' : ''}>⬇️</button>
        <button class="btn-icon edit" onclick="editSite(${index})">✏️</button>
        <button class="btn-icon danger" onclick="deleteSite(${index})">🗑️</button>
      </div>
    `;
    list.appendChild(item);
  });
}

function moveSite(index, direction) {
  const cat = appData.find(c => c.id === currentCategoryId);
  const newIndex = index + direction;
  if (newIndex >= 0 && newIndex < cat.sites.length) {
    const temp = cat.sites[index];
    cat.sites[index] = cat.sites[newIndex];
    cat.sites[newIndex] = temp;
    saveData();
    renderManageList();
    renderApp();
  }
}

function deleteSite(index) {
  if (confirm('هل أنت متأكد من حذف هذا الاختصار؟')) {
    const cat = appData.find(c => c.id === currentCategoryId);
    cat.sites.splice(index, 1);
    saveData();
    renderManageList();
    renderApp();
  }
}

function openAddModal() {
  editingIndex = null;
  uploadedIconBase64 = null;
  document.getElementById('addModalTitle').textContent = 'إضافة اختصار';
  document.getElementById('newUrl').value = '';
  document.getElementById('newNameEn').value = '';
  document.getElementById('newNameAr').value = '';
  document.getElementById('newColor').value = '#4cc9f0';
  document.getElementById('newIconFile').value = '';
  document.getElementById('addModal').classList.add('active');
}

function editSite(index) {
  const cat = appData.find(c => c.id === currentCategoryId);
  const site = cat.sites[index];
  
  editingIndex = index;
  uploadedIconBase64 = null;
  
  document.getElementById('addModalTitle').textContent = 'تعديل اختصار';
  document.getElementById('newUrl').value = site.url;
  document.getElementById('newNameEn').value = site.nameEn;
  document.getElementById('newNameAr').value = site.nameAr;
  document.getElementById('newColor').value = site.color;
  document.getElementById('newIconFile').value = '';
  
  document.getElementById('addModal').classList.add('active');
}

document.getElementById('newIconFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      uploadedIconBase64 = event.target.result;
    };
    reader.readAsDataURL(file);
  }
});

document.getElementById('btnSaveShortcut').addEventListener('click', () => {
  const urlInput = document.getElementById('newUrl').value.trim();
  let nameEnInput = document.getElementById('newNameEn').value.trim();
  let nameArInput = document.getElementById('newNameAr').value.trim();
  const color = document.getElementById('newColor').value;

  if (!urlInput) {
    alert('الرجاء إدخال الرابط (URL) على الأقل.');
    return;
  }

  if (!nameEnInput) {
    try {
      const urlObj = new URL(urlInput);
      nameEnInput = urlObj.hostname.replace('www.', '').split('.')[0];
      nameEnInput = nameEnInput.charAt(0).toUpperCase() + nameEnInput.slice(1);
    } catch (e) {
      nameEnInput = 'موقع جديد';
    }
  }
  if (!nameArInput) {
    nameArInput = nameEnInput;
  }

  const cat = appData.find(c => c.id === currentCategoryId);

  if (editingIndex !== null) {
    const oldSite = cat.sites[editingIndex];
    oldSite.nameEn = nameEnInput;
    oldSite.nameAr = nameArInput;
    oldSite.url = urlInput;
    oldSite.color = color;
    
    if (uploadedIconBase64) {
      oldSite.icon = uploadedIconBase64;
    } else {
      oldSite.icon = '';
    }
  } else {
    const finalIcon = uploadedIconBase64 || '';
    cat.sites.push({ nameEn: nameEnInput, nameAr: nameArInput, url: urlInput, color: color, icon: finalIcon });
  }
  
  saveData();
  closeModal('addModal');
  renderManageList();
  renderApp();
});

// ==========================================
// 7. أدوات مساعدة وتصدير الكود
// ==========================================
function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('active');
}

searchInput.addEventListener('input', renderApp);

async function exportCode() {
  let htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  htmlContent = htmlContent.replace(/class="modal-overlay active"/g, 'class="modal-overlay"');
  htmlContent = htmlContent.replace(/value="[^"]*"/g, 'value=""'); 
  
  const newDataString = JSON.stringify(appData, null, 2);
  const regex = /const defaultData = \[[\s\S]*?\];\s*\/\/ ==========================================\s*\/\/ 2\. إدارة البيانات/;
  
  if (regex.test(htmlContent)) {
    htmlContent = htmlContent.replace(regex, `const defaultData = ${newDataString};\n\n// ==========================================\n// 2. إدارة البيانات`);
  } else {
    htmlContent = htmlContent.replace(/const defaultData = \[[\s\S]*?\];/, `const defaultData = ${newDataString};`);
  }
  
  const oldKeyRegex = /const STORAGE_KEY = '[^']*';/;
  const newKey = 'quickBrowserData_' + Date.now();
  if (oldKeyRegex.test(htmlContent)) {
    htmlContent = htmlContent.replace(oldKeyRegex, `const STORAGE_KEY = '${newKey}';`);
  }

  const blob = new Blob([htmlContent], {type: 'text/html;charset=utf-8'});
  const fileName = 'index.html';
  const file = new File([blob], fileName, { type: 'text/html' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: 'المتصفح السريع - النسخة المحدثة',
        text: 'إليك ملف التطبيق مع كافة التعديلات المدمجة.'
      });
      closeModal('manageModal');
      return;
    } catch (error) {
      console.log('Share failed or cancelled', error);
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  closeModal('manageModal');
  alert('✅ تم تحميل الملف المحدث بنجاح!\nيمكنك الآن فتحه، أو رفعه إلى GitHub، أو إرساله عبر البلوتوث.');
}

// التشغيل
renderApp();
